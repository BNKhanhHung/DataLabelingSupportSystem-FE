<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xuất dữ liệu - Data Labeling</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:white;padding:40px}
.card{background:#1e293b;padding:24px;border-radius:10px;max-width:600px}
button{padding:10px 20px;margin-right:10px;margin-bottom:10px;border:none;color:white;border-radius:6px;cursor:pointer}
.json{background:#f59e0b}
.csv{background:#3b82f6}
a{color:#38bdf8}
#msg{margin-top:12px}
</style>
</head>
<body>

<a href="manager.html">← Manager</a>
<div class="card">
  <h2>Xuất dữ liệu sau khi duyệt</h2>
  <p style="margin-bottom:12px;color:#94a3b8;">Chọn project để xuất các data items đã được gắn nhãn (ANNOTATED/REVIEWED) của project đó.</p>
  <label for="projectSelect" style="display:block;margin-bottom:6px;">Project:</label>
  <select id="projectSelect" style="width:100%;max-width:400px;padding:8px 12px;border-radius:6px;background:#0f172a;color:#e2e8f0;border:1px solid #334155;margin-bottom:16px;">
    <option value="">-- Chọn project --</option>
  </select>
  <p id="msg">Chọn project và định dạng xuất.</p>
  <button class="json" id="btnJson">Export JSON (Data items)</button>
  <button class="csv" id="btnCsv">Export CSV (Data items)</button>
</div>

<script src="api-config.js"></script>
<script src="api-helper.js"></script>
<script>
(function() {
  // API: GET /api/data-items?page&size (lấy danh sách để export JSON hoặc CSV).
  var API = window.API;
  var cfg = window.API_CONFIG;
  if (!API || !API.requireAuth()) return;
  var msg = document.getElementById('msg');
  var projectSelect = document.getElementById('projectSelect');

  function loadProjects() {
    var size = 100;
    API.fetchWithAuth(cfg.projects + '?page=0&size=' + size).then(function(r) { return r.json(); }).then(function(data) {
      var list = data.content || [];
      var totalPages = data.totalPages != null ? data.totalPages : 1;
      var totalElements = data.totalElements != null ? data.totalElements : list.length;
      if (totalPages > 1 && list.length < totalElements) {
        var promises = [];
        for (var p = 1; p < totalPages; p++) {
          (function(page) {
            promises.push(API.fetchWithAuth(cfg.projects + '?page=' + page + '&size=' + size).then(function(res) { return res.json(); }));
          })(p);
        }
        Promise.all(promises).then(function(results) {
          results.forEach(function(res) { list = list.concat(res.content || []); });
          renderProjectOptions(list);
        });
      } else {
        renderProjectOptions(list);
      }
    }).catch(function() {
      projectSelect.innerHTML = '<option value="">Không tải được danh sách project</option>';
    });

    function renderProjectOptions(list) {
      projectSelect.innerHTML = '<option value="">-- Chọn project --</option>' +
        list.map(function(p) {
          var id = (p.id != null) ? (typeof p.id === 'string' ? p.id : String(p.id)) : '';
          var name = (p.name || id || '—').replace(/</g, '&lt;').replace(/"/g, '&quot;');
          return '<option value="' + id + '">' + name + '</option>';
        }).join('');
    }
  }

  function doExport(format) {
    var projectId = (projectSelect && projectSelect.value) ? projectSelect.value.trim() : '';
    if (!projectId) {
      msg.textContent = 'Vui lòng chọn một project.';
      msg.style.color = '#f87171';
      return;
    }
    msg.style.color = '';
    msg.textContent = 'Đang tải dữ liệu...';
    var url = cfg.dataItems + '/export?projectId=' + encodeURIComponent(projectId);
    API.fetchWithAuth(url).then(function(r) { return r.json(); }).then(function(list) {
      if (!Array.isArray(list)) list = [];
      if (list.length === 0) {
        msg.textContent = 'Project này chưa có data item nào đã gắn nhãn (ANNOTATED/REVIEWED).';
        return;
      }
      var baseName = 'data-items-project-' + projectId.substring(0, 8);
      if (format === 'json') {
        var blob = new Blob([JSON.stringify(list, null, 2)], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = baseName + '.json';
        a.click();
        URL.revokeObjectURL(a.href);
        msg.textContent = 'Đã tải xuống ' + baseName + '.json (' + list.length + ' mục).';
      } else {
        var headers = ['id', 'datasetId', 'datasetName', 'status', 'label', 'contentUrl', 'metadata', 'createdAt'].join(',');
        var rows = list.map(function(item) {
          var label = (item.label != null ? String(item.label) : '').replace(/,/g, ';').replace(/"/g, '""');
          if (label.indexOf(',') !== -1 || label.indexOf('"') !== -1) label = '"' + label + '"';
          return [item.id, item.datasetId, (item.datasetName || '').replace(/,/g, ';'), item.status, label, (item.contentUrl || '').replace(/,/g, ';'), (item.metadata || '').replace(/,/g, ';'), item.createdAt].join(',');
        });
        var csv = headers + '\n' + rows.join('\n');
        var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = baseName + '.csv';
        a.click();
        URL.revokeObjectURL(a.href);
        msg.textContent = 'Đã tải xuống ' + baseName + '.csv (' + list.length + ' mục).';
      }
    }).catch(function(err) {
      msg.textContent = 'Lỗi: ' + (err.message || '');
      msg.style.color = '#f87171';
    });
  }

  loadProjects();
  document.getElementById('btnJson').addEventListener('click', function() { doExport('json'); });
  document.getElementById('btnCsv').addEventListener('click', function() { doExport('csv'); });
})();
</script>
</body>
</html>
